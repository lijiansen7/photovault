services:
  photovault:
    # 多架构镜像（amd64 + arm64），由 .github/workflows/docker-publish.yml 自动发布到 GHCR
    image: ghcr.io/lijiansen7/photovault:latest
    container_name: photovault
    restart: unless-stopped
    ports:
      # TRIM_SERVICE_PORT = manifest 里声明的 service_port
      - "${TRIM_SERVICE_PORT}:8765"
    environment:
      # 首次启动会自动创建这个管理员，登录后会强制改密码
      INIT_ADMIN_USER: "admin"
      INIT_ADMIN_PASSWORD: "photovault"
      ALLOW_LEGACY_TOKEN: "0"
      TZ: "Asia/Shanghai"
      LOG_LEVEL: "INFO"
      # 0 = 不限制上传大小
      MAX_UPLOAD_MB: "0"
      THUMB_SIZE: "512"
      ENABLE_THUMB: "1"
      # 统一网关：容器内建 Unix Socket，飞牛网关用 HTTPS 代理出去。
      # 不用它的话，桌面入口只能嵌 http://IP:8765，而飞牛桌面是 HTTPS 的
      # （装了证书后 http 还会被强制跳转），浏览器会拦掉 iframe，点开就是打不开。
      GATEWAY_SOCKET: "/app/target/app.sock"
      # 网关不剥前缀，请求原样是 /app/photovault/...，
      # 服务端靠这个变量剥掉前缀，前端也靠它拼 API 地址（否则全 404）
      URL_PREFIX: "/app/photovault"
    volumes:
      # 照片和索引都在这里：TRIM_PKGVAR 是应用运行时数据目录
      - "${TRIM_PKGVAR}/data:/data"
      # 网关 Socket 要落在应用安装目录，飞牛才能找到（见 app/ui/config 的 gatewaySocket）
      - "${TRIM_APPDEST}:/app/target:rw"
