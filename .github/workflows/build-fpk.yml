name: Build offline fpk

# 把服务端镜像 docker save 进应用包，装的时候不用联网拉镜像。
# 在 Linux 上用官方 fnpack 打包 —— 顺带避免 Windows 丢 exec 位的问题。
# 依次构建 amd64 / arm64 两个架构，各自产出一个离线包。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arches:
        description: 目标架构（空格分隔）
        required: true
        default: "amd64 arm64"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 下载 fnpack（Linux）
        run: |
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack

      - name: 逐架构构建离线包
        env:
          ARCHES: ${{ github.event.inputs.arches || 'amd64 arm64' }}
        run: |
          set -euo pipefail
          mkdir -p fnos/photovault/app/docker
          for ARCH in $ARCHES; do
            echo "===== $ARCH ====="
            docker buildx build --platform "linux/$ARCH" --load -t photovault:offline ./server
            # compose 里写死的是这个标签，load 之后才能对上
            docker tag photovault:offline ghcr.io/lijiansen7/photovault:latest
            docker save ghcr.io/lijiansen7/photovault:latest \
              | gzip > fnos/photovault/app/docker/image.tar.gz
            test -s fnos/photovault/app/docker/image.tar.gz
            ./fnpack build --directory fnos/photovault
            # 没有这一行的话，某个架构构建失败会静默跳过，最后只产出一个包
            test -f photovault.fpk || { echo "::error::$ARCH 打包失败"; exit 1; }
            mv photovault.fpk "photovault-offline-$ARCH.fpk"
            rm -f fnos/photovault/app/docker/image.tar.gz
          done
          ls -lh photovault-offline-*.fpk

      - name: 附带到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            photovault-offline-*.fpk
            dist/*.apk

      - name: 提交到 dist 分支便于取回
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B dist
          mkdir -p dist
          mv photovault-offline-*.fpk dist/
          git add -f dist
          git commit -m "offline fpk (${GITHUB_REF_NAME})" || echo "no change"
          git push -f origin dist
