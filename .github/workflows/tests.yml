name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r tools/requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q server/app
      - name: Smoke test (in-process)
        run: python tools/smoke_test.py
      - name: Regression tests
        run: python tools/regression_test.py
      - name: Static web check
        run: python tools/check_web.py
      - name: Live HTTP e2e
        run: python tools/e2e_live.py
      - name: Multi-user / permissions e2e
        run: python tools/e2e_users.py
      - name: Hardening / trash / integrity e2e
        run: python tools/e2e_hardening.py

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: photovault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
