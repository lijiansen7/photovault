name: Build native fpk

# 原生（非 Docker）应用包：服务器代码 + 纯 Python wheel 一起打进 fpk，
# 装到 NAS 上直接用系统 python3 跑 uvicorn，不拉镜像、不联网。
#
# 两个区别只在「wheel 是哪个架构的」和 manifest 里的 platform：
#   x86 → manylinux2014_x86_64 / platform=x86   （飞牛 x86 机器）
#   arm → manylinux2014_aarch64 / platform=arm  （飞牛 arm 机器，如 F2V / 部分 N 系列）
#
# 所以同一个 workflow 循环两个架构，产物是 photovault-native-<版本>-<arch>.fpk。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arches:
        description: "目标架构（空格分隔：x86 arm）"
        required: true
        default: "x86 arm"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 下载 fnpack（Linux）
        run: |
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack
          ./fnpack --version || true

      - name: 逐架构构建原生包
        env:
          ARCHES: ${{ github.event.inputs.arches || 'x86 arm' }}
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version=//p' fnos-native/photovault/manifest)
          echo "版本 $VER"
          for ARCH in $ARCHES; do
            echo "===== $ARCH ====="
            case "$ARCH" in
              x86) PLAT=x86;      WHEEL_PLAT="--platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_28_x86_64" ;;
              arm) PLAT=arm;      WHEEL_PLAT="--platform manylinux2014_aarch64 --platform manylinux_2_17_aarch64 --platform manylinux_2_28_aarch64" ;;
              *) echo "::error::不认识的架构 $ARCH"; exit 1 ;;
            esac

            rm -rf staging && cp -r fnos-native/photovault staging

            # 服务器代码只有一份真源（仓库根的 server/），打包时拷进去
            mkdir -p staging/app/server
            cp -r server/app staging/app/server/app
            cp server/requirements.txt staging/app/server/
            find staging -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
            find staging -name "*.pyc" -delete

            # 架构相关的依赖：按目标平台下 wheel，不要本机（runner 是 x86）的那种
            python -m pip download -q -r server/requirements.txt \
              --only-binary=:all: --implementation cp --python-version 3.11 --abi cp311 \
              $WHEEL_PLAT -d staging/app/wheelhouse
            ls staging/app/wheelhouse

            # 一个包只能装一个架构，改 manifest 免得把 arm 包装到 x86 机器上
            sed -i "s/^platform=.*/platform=$PLAT/" staging/manifest

            ./fnpack build --directory staging
            test -f photovault.fpk || { echo "::error::$ARCH 打包失败"; exit 1; }
            mv photovault.fpk "photovault-native-$VER-$ARCH.fpk"
            rm -rf staging
          done
          ls -lh photovault-native-*.fpk
          sha256sum photovault-native-*.fpk | tee SHA256SUMS.txt

      - name: 附带到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            photovault-native-*.fpk
            SHA256SUMS.txt

      - name: 也留一份 artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-fpk
          path: |
            photovault-native-*.fpk
            SHA256SUMS.txt
          retention-days: 14
